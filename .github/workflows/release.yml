name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - run: node --test

      - name: Build package
        run: |
          version="${TAG#v}"
          package="$PWD/kinopoisk-shortcut-$version.zip"
          jq --arg v "$version" '.version = $v' src/manifest.json > manifest.tmp
          mv manifest.tmp src/manifest.json
          (cd src && zip -r "$package" .)
          zip "$package" LICENSE

      - name: Publish release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" kinopoisk-shortcut-*.zip --clobber
          else
            gh release create "$TAG" kinopoisk-shortcut-*.zip --generate-notes
          fi
